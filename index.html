    <script>
      // Benign Vite HMR WebSocket suppression for sandboxed cloud preview environment
      function isBenignWsError(msg) {
        if (!msg) return false;
        var str = String(msg);
        return str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1;
      }
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var text = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (isBenignWsError(text)) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        var text = (event && (event.message || (event.error && event.error.message))) || '';
        if (isBenignWsError(text)) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
